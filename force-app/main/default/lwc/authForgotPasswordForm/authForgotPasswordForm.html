<template>
    <c-auth-card title={labels.title}>
        <template lwc:if={isSent}>
            <p class="form__success" role="status">{labels.success}</p>
        </template>
        <template lwc:else>
            <form class="form" onsubmit={handleSubmit} novalidate>
                <p class="form__instructions">{labels.instructions}</p>
                <div lwc:if={errorMessage} class="form__error" role="alert">{errorMessage}</div>
                <lightning-input
                    class="form__field"
                    type="email"
                    name="email"
                    label={labels.email}
                    autocomplete="email"
                    required
                    message-when-value-missing={labels.required}
                    value={email}
                    onchange={handleChange}
                ></lightning-input>
                <lightning-button
                    class="form__submit"
                    type="submit"
                    variant="brand"
                    label={labels.submit}
                    disabled={isLoading}
                ></lightning-button>
                <div lwc:if={isLoading} class="form__spinner">
                    <lightning-spinner
                        alternative-text={labels.loading}
                        size="small"
                    ></lightning-spinner>
                </div>
            </form>
        </template>
        <div slot="footer" class="links">
            <a href={loginUrl} data-id="login" onclick={handleLogin}>{labels.backToLogin}</a>
        </div>
    </c-auth-card>
</template>
