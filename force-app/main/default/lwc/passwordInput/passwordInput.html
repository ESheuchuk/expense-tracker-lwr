<template>
    <div class={formElementClass}>
        <label class="slds-form-element__label" for="password">
            <abbr lwc:if={required} class="slds-required" title={labels.required}>*</abbr>
            {label}
        </label>
        <div class="slds-form-element__control slds-input-has-icon slds-input-has-icon_right">
            <input
                id="password"
                class="slds-input"
                type={inputType}
                name={name}
                value={value}
                autocomplete={autocomplete}
                required={required}
                aria-invalid={ariaInvalid}
                aria-describedby="password-help"
                oninput={handleInput}
                onblur={handleBlur}
            />
            <button
                type="button"
                class="slds-button slds-button_icon slds-input__icon slds-input__icon_right"
                title={toggleLabel}
                aria-pressed={ariaPressed}
                onclick={handleToggle}
            >
                <lightning-icon
                    icon-name={toggleIcon}
                    size="x-small"
                    alternative-text={toggleLabel}
                ></lightning-icon>
            </button>
        </div>
        <div lwc:if={errorMessage} id="password-help" class="slds-form-element__help">
            {errorMessage}
        </div>
    </div>
</template>
